name: ci

on:
  push:
  pull_request:

jobs:
  license-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/license-check/license_check.py

  stage0:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clang and libstdc++ (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-19 g++-14 ninja-build
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_BUILD_TYPE=Debug -DPHS_WERROR=ON -DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DPHS_WERROR=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: python tests/test_license_check.py
      - run: python tests/test_golden_runner.py
      - run: python tests/run_golden.py --stage0 build/phantasos-stage0
      - run: python tests/test_frontend.py --stage0 build/phantasos-stage0
      - run: python tests/stress/profile_hierarchy.py --stage0 build/phantasos-stage0 --classes 5000 --max-kib-per-class 8.5
      - run: python tests/stress/profile_hierarchy.py --stage0 build/phantasos-stage0 --shapes generic --classes 1000,8000 --max-growth 1.8
      - run: python tests/fuzz_frontend.py --stage0 build/phantasos-stage0 --cases 300
      - run: python tests/fuzz_frontend.py --stage0 build/phantasos-stage0 --command check --cases 300
      - run: python tests/fuzz_frontend.py --stage0 build/phantasos-stage0 --command gate --cases 300
      - run: python tests/fuzz_frontend.py --stage0 build/phantasos-stage0 --command mir --cases 300
      - run: python tests/fuzz_frontend.py --stage0 build/phantasos-stage0 --command asm --cases 300
      - run: python tests/fuzz_frontend.py --stage0 build/phantasos-stage0 --command build --cases 300

  stage0-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-19 g++-14 ninja-build
      - run: >
          cmake -S . -B build/san -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_BUILD_TYPE=Debug -DPHS_WERROR=ON
          "-DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14 -fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build/san
      - run: ctest --test-dir build/san --output-on-failure
      - run: python3 tests/run_golden.py --stage0 build/san/phantasos-stage0
      - run: python3 tests/test_frontend.py --stage0 build/san/phantasos-stage0
      - run: python3 tests/fuzz_frontend.py --stage0 build/san/phantasos-stage0 --cases 1000
      - run: python3 tests/fuzz_frontend.py --stage0 build/san/phantasos-stage0 --command check --cases 1000
      - run: python3 tests/fuzz_frontend.py --stage0 build/san/phantasos-stage0 --command gate --cases 1000
      - run: python3 tests/fuzz_frontend.py --stage0 build/san/phantasos-stage0 --command mir --cases 1000
      - run: python3 tests/fuzz_frontend.py --stage0 build/san/phantasos-stage0 --command asm --cases 1000
      - run: python3 tests/fuzz_frontend.py --stage0 build/san/phantasos-stage0 --command build --cases 1000
